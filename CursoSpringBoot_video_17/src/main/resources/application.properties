spring.application.name=CursoSpringBoot_video_17

server.port=8090

#Sirve para desactivar devTools
spring.devtools.restart.enabled=true

#Propiedades asociadas al actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=health, env, beans

management.endpoint.health.show-details=always

#Posibles valores para mostrar la informacion de env
# always, never, y when-authorized
management.endpoint.env.show-values=always

management.info.env.enabled=true
info.app.name=CursoSpringBoot_video_16
info.app.version=1.0.0
info.app.description=Spring JPA, consultas nativas.

#Configuracion de la base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/laboratorio
spring.datasource.username=springboot
spring.datasource.password=cuervo
spring.driver-class-name=org.postgresql.Driver

##Configuración de la base de datos MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/laboratorio
#spring.datasource.username=springboot
#spring.datasource.password=canzervero
#spring.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
